[package]
name = "human-controller"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "human_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2.32"
anyhow = "1.0.102"
enigo = "0.6.1"
image = "0.25.10"
imageproc = "0.27.0"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.12", features = [
    # TODO: plaform specific features
    # "coreml",
    "xnnpack",
    # "webgpu", # doesnt build on macos???
    # "directml",
    # "cuda",
    # "tensorrt",
    # "directml",
] }
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { version = "1.52.3", features = ["time"] }
tauri-plugin-log = "2"
log = "0.4.33"
nokhwa = { version = "0.10.0", features = ["input-native", "output-threaded"] }
ndarray-npy = "0.10.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
